# unless otherwise specified, hooks run on push only
default_stages: [pre-push]
repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        types_or: [ python ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, markdown ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  # formatters and linters are available in the virtualenv so they can be run from the makefile & vscode
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        # run on all files to catch type errors that affect unchanged files
        pass_filenames: false
        language: unsupported
        types: [python]
      - id: test
        name: test
        entry: make test
        # run on all files
        pass_filenames: false
        language: unsupported
        types: [python]
